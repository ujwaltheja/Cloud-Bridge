        extend: {
          colors: {
            af: {

  <style>
    @layer components {
      .af-card {
        @apply bg-white rounded-xl transition-all duration-300 ease-out;
        border: 1px solid #d4ddf0;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.09), 0 1px 4px rgba(15, 23, 42, 0.05);
      }
      .dark .af-card {
        background: rgba(22, 31, 48, 0.85);
        border-color: rgba(255, 255, 255, 0.08);
        box-shadow: none;
      }
      .af-card:hover {

        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.14), 0 4px 10px rgba(15, 23, 42, 0.07);
      }
      .dark .af-card:hover {
        box-shadow: 0 12px 35px rgba(0, 161, 224, 0.08);
      }
      
      .af-gradient-text {
        background: linear-gradient(135deg, #00A1E0 0%, #7C3AED 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .af-header-light {
        background: rgba(255, 255, 255, 0.95);
      }
      
      .af-tab-active {
        color: #00A1E0;
        background: rgba(0, 161, 224, 0.12);
        border-bottom: 2px solid #00A1E0;
      }
      
      .af-btn-primary {
        @apply px-5 py-2 rounded-lg font-semibold text-sm text-white
               bg-af-blue hover:bg-sky-500 transition-colors
               disabled:opacity-50 disabled:cursor-not-allowed;
      }
      
      .af-btn-secondary {
        @apply px-4 py-1.5 rounded-lg text-sm font-medium
               bg-slate-100 hover:bg-slate-200 text-slate-700
               dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-300
               transition-colors;
      }
      
      .af-input {
        @apply w-full rounded-lg px-3 py-2 text-sm text-slate-800
               focus:outline-none focus:ring-2 focus:ring-af-blue/40
               transition;
        border: 1px solid #d4ddf0;
        background: #ffffff;
      }
      
      .dark .af-input {
        background: #161F30;
        border-color: rgba(255, 255, 255, 0.1);
        color: #E2E8F0;
      }
      
      .dark .af-input:focus {
        ring-color: rgba(0, 161, 224, 0.3);
      }
      
      /* Ensure select dropdowns work in dark mode */
      .dark select.af-input option {
        background: #161F30;
        color: #E2E8F0;
      }
      
      /* Textarea in dark mode */
      .dark textarea.af-input {
        background: #161F30;
        border-color: rgba(255, 255, 255, 0.1);
        color: #E2E8F0;
      }
      
      .af-panel {
        @apply bg-white dark:bg-af-darkcard rounded-xl p-6 mb-6;
        border: 1px solid #d4ddf0;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.09), 0 1px 4px rgba(15, 23, 42, 0.05);
      }
      .dark .af-panel {
        border-color: rgba(255, 255, 255, 0.1);
        box-shadow: none;
      }
    }

                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-400">Permission Dependencies · High</span>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400">Integration Points · Low</span>
                  </div>
                  <div class="flex gap-2">
                    <button class="af-btn-primary">Approve Deployment</button>
                    <button class="af-btn-secondary">Generate Release Plan</button>
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="af-card p-6">
                  <h3 class="text-lg font-semibold mb-4 text-slate-800 dark:text-slate-100">AI Recommendations</h3>
                  <pre class="text-sm text-slate-700 dark:text-slate-300 font-mono">✓ Deploy CustomMetadata before Apex classes
✓ Run Apex tests before production deployment
✓ Verify permission set assignments after deployment
✓ Monitor integration endpoints for 24 hours</pre>
                </div>

                <div class="af-card p-6">
                  <h3 class="text-lg font-semibold mb-4 text-slate-800 dark:text-slate-100">Predicted Issues</h3>
                  <div class="space-y-2">
                    <div class="p-3 rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-900/40">
                      <div class="text-sm font-semibold text-amber-700 dark:text-amber-400">⚠ Test Coverage</div>
                      <div class="text-xs text-slate-600 dark:text-slate-400 mt-1">Some Apex classes may not meet 75% coverage threshold</div>
                    </div>
                    <div class="p-3 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/40">
                      <div class="text-sm font-semibold text-red-700 dark:text-red-400">⚠ Permission Dependencies</div>
                      <div class="text-xs text-slate-600 dark:text-slate-400 mt-1">New fields require permission set updates</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `
      },
      {
        id: "deployments",
        label: "6. Deployments",
        title: "Deployment Validation",
        description: "Create a Validate Only job to prove the AI-approved package is safe before production deployment.",
        content: `
          <div class="af-panel">
            <h2 class="font-semibold text-slate-700 dark:text-slate-200 mb-4">Create Deployment</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
              <div>
                <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wide">Target Org</label>
                <select class="af-input text-sm">
                  <option value="">Select Target…</option>
                  <option>Production Org</option>
                  <option>Demo Sandbox</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wide">Retrieval Package</label>
                <select class="af-input text-sm">
                  <option value="">Select Package…</option>
                  <option>6/23/2026, 01:15 PM - Package</option>
                </select>
              </div>
            </div>

            <div class="mb-5">
              <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300">
                <input type="checkbox" class="rounded border-slate-300 dark:border-slate-600" checked />
                <span>Validate Only (recommended for production)</span>
              </label>
            </div>

            <button class="af-btn-primary mb-6" onclick="showDeployment()">Start Deployment</button>

            <div id="deployment-results" class="hidden">
              <div class="af-card p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-100">Deployment Status</h3>
                  <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-af-blue/10 text-af-blue dark:bg-af-blue/20">In Progress</span>
                </div>
                
                <div class="space-y-3">
                  <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                    <span class="text-sm text-slate-700 dark:text-slate-300">Uploading package...</span>
                  </div>
                  <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-af-blue animate-pulse"></div>
                    <span class="text-sm text-slate-700 dark:text-slate-300">Running validation...</span>
                  </div>
                  <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-slate-300 dark:bg-slate-600"></div>
                    <span class="text-sm text-slate-500 dark:text-slate-400">Pending: Apex tests</span>
                  </div>
                </div>

                <div class="mt-4 h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-af-blue to-af-purple rounded-full transition-all duration-500" style="width: 45%"></div>
                </div>
              </div>

              <div class="text-sm text-slate-500 dark:text-slate-400">
                <strong>Note:</strong> This is a validate-only deployment. No changes will be made to the target org.
              </div>
            </div>
          </div>
        `
      }
    ];

    let currentScreen = 0;
    let isDark = false;

    function initTheme() {
      try {
        isDark = localStorage.getItem('cb_dark') === 'true';
      } catch {}
      document.documentElement.classList.toggle('dark', isDark);
    }

    function toggleTheme() {
      isDark = !isDark;
      document.documentElement.classList.toggle('dark', isDark);
      try {
        localStorage.setItem('cb_dark', String(isDark));
      } catch {}
      toast(isDark ? '🌙 Dark mode enabled' : '☀️ Light mode enabled');
    }

    function renderNav() {
      const nav = document.getElementById('nav-tabs');
      nav.innerHTML = screens.map((screen, i) => `
        <button
          onclick="setScreen(${i})"
          class="px-3 py-1.5 rounded-md text-sm font-semibold transition-colors ${
            i === currentScreen
              ? 'text-af-blue bg-af-blue/15 dark:text-af-blue dark:bg-af-blue/15'
              : 'text-slate-600 dark:text-slate-400 hover:text-af-blue hover:bg-af-blue/5'
          }"
        >
          ${screen.label}
        </button>
      `).join('');
    }

    function renderScreen() {
      const screen = screens[currentScreen];
      const container = document.getElementById('screens-container');
      container.innerHTML = `
        <div class="mb-6">
          <div class="flex items-start justify-between mb-2">
            <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">${screen.title}</h2>
            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-af-purple/10 text-af-purple dark:bg-af-purple/20">
              Step ${currentScreen + 1} of ${screens.length}
            </span>
          </div>
          <p class="text-slate-500 dark:text-slate-400">${screen.description}</p>
        </div>
        ${screen.content}
        <div class="flex gap-3 mt-8">
          <button 
            onclick="prevScreen()" 
            class="af-btn-secondary ${currentScreen === 0 ? 'opacity-50 cursor-not-allowed' : ''}"
            ${currentScreen === 0 ? 'disabled' : ''}
          >
            ← Previous
          </button>
          <button 
            onclick="nextScreen()" 
            class="af-btn-primary ${currentScreen === screens.length - 1 ? 'opacity-50 cursor-not-allowed' : ''}"
            ${currentScreen === screens.length - 1 ? 'disabled' : ''}
          >
            Next →
          </button>
        </div>
      `;
    }

    function setScreen(index) {
      currentScreen = index;
      renderNav();
      renderScreen();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function nextScreen() {
      if (currentScreen < screens.length - 1) {
        setScreen(currentScreen + 1);
      }
    }

    function prevScreen() {
      if (currentScreen > 0) {
        setScreen(currentScreen - 1);
      }
    }

    function toast(message) {
      const toastEl = document.createElement('div');
      toastEl.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full bg-slate-800 dark:bg-slate-700 text-white text-sm font-semibold shadow-lg z-50 animate-fade-in';
      toastEl.textContent = message;
      document.body.appendChild(toastEl);
      setTimeout(() => {
        toastEl.style.opacity = '0';
        toastEl.style.transform = 'translateX(-50%) translateY(10px)';
        setTimeout(() => toastEl.remove(), 300);
      }, 2000);
    }

    function showComparison() {
      document.getElementById('comparison-results').classList.remove('hidden');
      toast('✓ Comparison complete');
    }

    function showDependency() {
      document.getElementById('dependency-results').classList.remove('hidden');
      toast('✓ Dependency graph built');
    }

    function showRelease() {
      document.getElementById('release-results').classList.remove('hidden');
      toast('✓ AI analysis complete');
    }

    function showDeployment() {
      document.getElementById('deployment-results').classList.remove('hidden');
      toast('✓ Deployment started');
    }

    // Initialize
    initTheme();
    renderNav();
    renderScreen();
  </script>

  <style>
    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }
    .animate-fade-in {
      animation: fade-in 0.3s ease-out;
    }
  </style>
</body>
</html>
