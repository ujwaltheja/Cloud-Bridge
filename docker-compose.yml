# Cloud Bridge - Docker Compose
# Defaults target the local Docker network.
# Override via .env (or shell env) to point at cluster endpoints.

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cloudbridge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudbridge_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cloudbridge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudbridge} -d ${POSTGRES_DB:-cloudbridge}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (Celery broker + result backend)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cloudbridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO (S3-compatible object storage)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: cloudbridge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Create the default bucket on startup (idempotent, targets local MinIO only)
  minio-init:
    image: minio/mc:latest
    container_name: cloudbridge-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password} &&
      mc mb -p local/${MINIO_BUCKET:-cloudbridge-artifacts} || true &&
      mc anonymous set download local/${MINIO_BUCKET:-cloudbridge-artifacts} || true &&
      echo 'MinIO bucket ready: ${MINIO_BUCKET:-cloudbridge-artifacts}'
      "
    restart: "no"

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudbridge-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://cloudbridge:cloudbridge_dev_password@postgres:5432/cloudbridge}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - FERNET_KEY=${FERNET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - BACKEND_API_KEY=${BACKEND_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin_dev_password}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://minio:9000}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_VERIFY_SSL=${AWS_VERIFY_SSL:-true}
      - MINIO_BUCKET=${MINIO_BUCKET:-cloudbridge-artifacts}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_ENDPOINT_URL=${LLM_ENDPOINT_URL}
      - LLM_MODEL=${LLM_MODEL}
    volumes:
      - ./backend:/app
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudbridge-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://cloudbridge:cloudbridge_dev_password@postgres:5432/cloudbridge}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - FERNET_KEY=${FERNET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - BACKEND_API_KEY=${BACKEND_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin_dev_password}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://minio:9000}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_VERIFY_SSL=${AWS_VERIFY_SSL:-true}
      - MINIO_BUCKET=${MINIO_BUCKET:-cloudbridge-artifacts}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_ENDPOINT_URL=${LLM_ENDPOINT_URL}
      - LLM_MODEL=${LLM_MODEL}
    volumes:
      - ./backend:/app
    command: celery -A app.infrastructure.celery_app worker --loglevel=INFO -Q default,high_priority
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend (React + Vite)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudbridge-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      - VITE_BACKEND_API_KEY=${VITE_BACKEND_API_KEY}
    user: "0:0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
